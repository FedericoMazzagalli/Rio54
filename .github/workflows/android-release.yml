name: RIO54 Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rio54-android-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and sign Android release APK
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install Android 16 build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Unpack Android Studio project
        run: unzip -q android/RIO54_Android_Offline_App_v0_1.zip -d android-build

      - name: Validate packaged RIO54 assets and app settings
        working-directory: android-build/RIO54_Android_App
        run: python3 tools/validate_android_assets.py

      - name: Assemble release APK
        working-directory: android-build/RIO54_Android_App
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Follow ANDROID_RELEASE_ES.md before running this workflow."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/rio54-release-keystore"
          export KEYSTORE_PATH
          python3 - <<'PY'
          import base64, os
          data = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          if not data:
              raise SystemExit("Keystore secret decoded to an empty file")
          with open(os.environ["KEYSTORE_PATH"], "wb") as f:
              f.write(data)
          PY
          APK_UNSIGNED="$(find android-build/RIO54_Android_App/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_UNSIGNED" && test -s "$APK_UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/RIO54-release.apk" \
            "$APK_UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/RIO54-release.apk"
          shasum -a 256 "$RUNNER_TEMP/RIO54-release.apk" > "$RUNNER_TEMP/RIO54-release.apk.sha256"
          rm -f "$KEYSTORE_PATH"

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: RIO54-Android-signed-release
          path: |
            ${{ runner.temp }}/RIO54-release.apk
            ${{ runner.temp }}/RIO54-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
