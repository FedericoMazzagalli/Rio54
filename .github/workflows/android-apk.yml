name: RIO54 Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/RIO54_Android_Offline_App_v0_1.zip'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/RIO54_Android_Offline_App_v0_1.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build offline Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Unpack Android Studio project
        run: unzip -q android/RIO54_Android_Offline_App_v0_1.zip -d android-build
      - name: Validate packaged RIO54 assets and app settings
        working-directory: android-build/RIO54_Android_App
        run: python3 tools/validate_android_assets.py
      - name: Assemble debug APK
        working-directory: android-build/RIO54_Android_App
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: test -s android-build/RIO54_Android_App/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RIO54-Android-debug-APK
          path: android-build/RIO54_Android_App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
