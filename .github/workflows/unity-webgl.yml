name: RIO54 Unity WebGL

on:
  push:
    branches: [main]
    paths:
      - 'unity/rio54_unity_webgl_proyecto_v1_4.zip'
      - '.github/workflows/unity-webgl.yml'
      - 'Tools/prepare_unity_ci.py'
  pull_request:
    branches: [main]
    paths:
      - 'unity/rio54_unity_webgl_proyecto_v1_4.zip'
      - '.github/workflows/unity-webgl.yml'
      - 'Tools/prepare_unity_ci.py'
  workflow_dispatch:
    inputs:
      build_unity:
        description: 'Compilar Unity WebGL (.wasm). Requiere UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-unity-source:
    name: Validate Unity source and 8-language campaign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely unpack Unity project
        run: python3 Tools/prepare_unity_ci.py --archive unity/rio54_unity_webgl_proyecto_v1_4.zip --destination _unity_src
      - name: Validate project structure and multilingual data
        working-directory: _unity_src/RIO54_Unity_WebGL
        run: python3 Tools/validate_project.py

  build-unity-webgl:
    name: Build Unity WebGL player (.wasm)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_unity) }}
    needs: validate-unity-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely unpack Unity project
        run: python3 Tools/prepare_unity_ci.py --archive unity/rio54_unity_webgl_proyecto_v1_4.zip --destination _unity_src
      - name: Install licensed Noto CJK fonts
        working-directory: _unity_src/RIO54_Unity_WebGL
        run: python3 Tools/setup_cjk_fonts.py
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Faltan secretos UNITY_LICENSE, UNITY_EMAIL o UNITY_PASSWORD. Consultá README_ES.txt y la documentación GameCI."
            exit 1
          fi
      - name: Build Unity WebGL with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: _unity_src/RIO54_Unity_WebGL
          unityVersion: auto
          targetPlatform: WebGL
          buildName: RIO54-WebGL
          buildsPath: build
          buildMethod: RIO54BuildTools.GameCIBuildWebGL
          allowDirtyBuild: true
      - name: Include Noto CJK license notices
        run: |
          mkdir -p build/WebGL/ThirdPartyNotices/NotoCJK
          cp _unity_src/RIO54_Unity_WebGL/Assets/Resources/Fonts/LICENSE_NotoSansCJKjp.txt build/WebGL/ThirdPartyNotices/NotoCJK/
          cp _unity_src/RIO54_Unity_WebGL/Assets/Resources/Fonts/LICENSE_NotoSansCJKsc.txt build/WebGL/ThirdPartyNotices/NotoCJK/
      - name: Validate compiled WebGL player
        working-directory: _unity_src/RIO54_Unity_WebGL
        run: python3 Tools/validate_webgl_output.py --path ../../build/WebGL
      - name: Upload Unity WebGL player
        uses: actions/upload-artifact@v4
        with:
          name: RIO54-Unity-WebGL
          path: build/WebGL
          if-no-files-found: error
          retention-days: 30
